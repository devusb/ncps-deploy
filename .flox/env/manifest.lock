  "manifest": {
    "version": 1,
    "install": {
      "coreutils": {
        "pkg-path": "coreutils"
      },
      "dbmate": {
        "pkg-path": "dbmate"
      },
      "ncps": {
        "pkg-path": "ncps"
      }
    },
    "hook": {
      "on-activate": "mkdir -p $FLOX_ENV_CACHE/ncps/db\nmkdir -p $FLOX_ENV_CACHE/ncps/storage\n\nncps_dir=$(dirname \"$(dirname \"$(readlink -f \"$(type -p ncps)\")\")\")\ndbmate --migrations-dir=$ncps_dir/share/ncps/db/migrations --url=sqlite:$FLOX_ENV_CACHE/ncps/db/db.sqlite migrate up\n"
    },
    "options": {
      "activate": {
        "mode": "run"
      }
    },
    "services": {
      "ncps": {
        "command": "ncps serve \\\n\t--cache-hostname=ncps \\\n\t--cache-data-path=$FLOX_ENV_CACHE/ncps/storage \\\n\t--cache-database-url=sqlite:$FLOX_ENV_CACHE/ncps/db/db.sqlite \\\n\t--upstream-cache=https://cache.nixos.org \\\n\t--upstream-public-key=cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=\n"
      }
    }
  },
